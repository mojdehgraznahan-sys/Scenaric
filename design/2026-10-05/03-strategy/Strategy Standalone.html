/* Scenaric.ai design tokens */
:root {
  /* Brand */
  --ink: #1E1B2E;
  --ink-2: #29243D;
  --orange: #F97316;
  --orange-hover: #EA6B0B;
  --orange-50: #FFF7ED;
  --orange-100: #FED7AA;
  --orange-200: #FBC589;
  --orange-700: #C2410C;
  --green-50: #ECFDF5;
  --green-500: #10B981;
  --green-700: #065F46;
  --red-50: #FEF2F2;
  --red-500: #EF4444;
  --amber-300: #F59E0B;
  --amber-50: #FFFBEB;
  --amber-bell: #F59E0B;
  --blue-50: #EFF6FF;
  --blue-500: #3B82F6;
  --blue-700: #1D4ED8;
  --purple-50: #F5F3FF;
  --purple-500: #8B5CF6;
  --teal-50: #F0FDFA;
  --teal-500: #14B8A6;

  /* Surface */
  --bg: #F5F5F5;
  --card: #FFFFFF;
  --border: #E5E7EB;
  --border-strong: #D1D5DB;

  /* Text */
  --text: #0F172A;
  --text-2: #6B7280;
  --text-3: #9CA3AF;

  /* Effects */
  --shadow-card: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.04);
  --shadow-elev: 0 8px 24px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);

  /* Radius */
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 10px;
  --r-xl: 14px;
  --r-2xl: 20px;

  /* Type */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--text);
  background: var(--bg);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* Reusable */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  font-weight: 500;
  border-radius: var(--r-md);
  padding: 10px 16px;
  font-size: 14px;
  line-height: 1;
  border: 1px solid transparent;
  transition: background .15s ease, border-color .15s ease, color .15s ease, transform .05s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(0.5px); }
.btn-primary { background: var(--orange); color: #fff; border-color: var(--orange); }
.btn-primary:hover { background: var(--orange-hover); border-color: var(--orange-hover); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: #F9FAFB; border-color: var(--border-strong); }
.btn-soft { background: var(--orange-50); color: var(--orange-700); border-color: var(--orange-100); }
.btn-soft:hover { background: #FEEBD2; }
.btn-dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-dark:hover { background: #2c2742; }
.btn-on-ink { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.2); }
.btn-on-ink:hover { background: rgba(255,255,255,.15); }
.btn-lg { padding: 14px 22px; font-size: 15px; }
.btn-sm { padding: 7px 11px; font-size: 13px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
}
.input {
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: #fff;
  outline: none;
  transition: border .15s ease, box-shadow .15s ease;
}
.input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(249,115,22,.2); }
.textarea { resize: none; line-height: 1.55; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid transparent;
}
.chip-social    { background: #F5F3FF; color: #8B5CF6; border-color: rgba(139,92,246,.25); }
.chip-technology{ background: #EFF6FF; color: #3B82F6; border-color: rgba(59,130,246,.25); }
.chip-economic  { background: #ECFDF5; color: #10B981; border-color: rgba(16,185,129,.25); }
.chip-ecological{ background: #F0FDFA; color: #14B8A6; border-color: rgba(20,184,166,.25); }
.chip-political { background: #FEF2F2; color: #EF4444; border-color: rgba(239,68,68,.25); }

.badge-high   { background: #FFF7ED; color: #C2410C; }
.badge-mid    { background: #FFFBEB; color: #B45309; }
.badge-low    { background: #ECFDF5; color: #065F46; }
.badge {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 600;
  padding: 2px 7px; border-radius: 4px;
  letter-spacing: .04em; text-transform: uppercase;
}

.eyebrow {
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--orange);
  font-weight: 500;
}
.mono { font-family: var(--font-mono); }

.divider { height: 1px; background: var(--border); }
.scroll-y { overflow-y: auto; }
.scroll-y::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll-y::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
.scroll-y::-webkit-scrollbar-track { background: transparent; }

/* Stars */
.stars { display: inline-flex; gap: 1px; }
.star { width: 12px; height: 12px; }
.star-fill { color: var(--orange); }
.star-empty { color: var(--border); }

/* Sidenav */
.fm-mark {
  width: 28px; height: 28px;
  background: var(--ink);
  color: #fff;
  border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: -0.02em;
  font-family: var(--font-mono);
}
.sec-label {
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0 11px;
  margin: 14px 0 6px;
  font-weight: 500;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 34px;
  margin: 2px 7px;
  padding: 0 9px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  color: #6B7280;
  cursor: pointer;
  border: none; background: transparent; text-align: left;
  width: calc(100% - 14px);
  transition: background .12s ease, color .12s ease;
}
.nav-item:hover { color: var(--text); background: #F3F4F6; }
.nav-item.active { background: var(--orange); color: #fff; }
.nav-item.active:hover { background: var(--orange); }
.nav-icon { width: 14px; height: 14px; flex-shrink: 0; }
.nav-dot {
  margin-left: auto;
  width: 6px; height: 6px;
  border-radius: 999px;
  background: var(--amber-bell);
}

/* Pill horizon grid (onboarding) */
.horizon-card {
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 14px 16px;
  text-align: left;
  background: #fff;
  cursor: pointer;
  transition: border .15s ease, background .15s ease;
}
.horizon-card.selected {
  border: 2px solid var(--orange);
  background: var(--orange-50);
  padding: 13px 15px;
}
.horizon-card:hover:not(.selected) { border-color: var(--border-strong); }

/* Progress bar */
.progress-track { height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--orange); transition: width .3s ease; }

/* Matrix dot */
.matrix-dot {
  position: absolute;
  width: 36px; height: 36px;
  border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  cursor: grab;
  user-select: none;
  transform: translate(-50%, -50%);
  transition: box-shadow .15s ease;
}
.matrix-dot.dragging { cursor: grabbing; }
.matrix-dot { transition: box-shadow .15s ease, transform .15s ease, border-width .12s ease; }
.matrix-dot--candidate { cursor: pointer; }
.matrix-dot--candidate:hover { border-width: 2px !important; transform: translate(-50%, -50%) scale(1.08); }

/* Tab */
.tab {
  padding: 8px 2px;
  margin: 0 14px;
  border-bottom: 2px solid transparent;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  background: transparent;
  border-top: none; border-left: none; border-right: none;
}
.tab:first-child { margin-left: 0; }
.tab.active { color: var(--orange); border-bottom-color: var(--orange); }

/* Upload zone */
.dropzone {
  border: 2px dashed var(--border);
  background: #fff;
  border-radius: var(--r-xl);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border .15s ease, background .15s ease;
}
.dropzone:hover, .dropzone.drag {
  border-color: var(--orange);
  background: var(--orange-50);
}

/* Skeleton stripe placeholder */
.placeholder-img {
  background:
    repeating-linear-gradient(
      135deg,
      #F3F4F6 0 12px,
      #E5E7EB 12px 24px
    );
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  color: var(--text-2);
  font-size: 11px;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn .25s ease-out both; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .5; }
}
.pulse { animation: pulse 1.6s ease-in-out infinite; }

@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.slide-up { animation: slideUp .3s ease-out both; }

/* Storyline — drop-target pulse for arrow rewiring/creation */
@keyframes fmDropPulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(249,115,22,0.18), 0 4px 14px rgba(15,23,42,0.10); }
  50%      { box-shadow: 0 0 0 8px rgba(249,115,22,0.10), 0 4px 14px rgba(15,23,42,0.10); }
}
/* Storyline — toast slide-in from bottom-right */
@keyframes fmToastIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

    health(scId) {
      const sup = D.tracked.filter(t => t.supports.includes(scId));
      const block = D.tracked.filter(t => !t.supports.includes(scId));
      const gaining = sup.filter(t => delta(t) > 0), weakening = sup.filter(t => delta(t) < 0);
      const blockersRising = block.filter(t => delta(t) > 0 && t.hist[t.hist.length - 1] < 4);
      const m = this.momentum(scId).score;
      const rivals = (window.FM_DATA.scenarios || []).filter(s => s.id !== scId && this.momentum(s.id).score >= 6);
      let label = "On course", tone = "low";
      if (m < 0 && rivals.length) { label = "Off course"; tone = "high"; }
      else if (weakening.some(t => t.impact >= 4) || blockersRising.length) { label = "At risk"; tone = "mid"; }
      else if (gaining.length <= weakening.length) { label = "Holding"; tone = "mid"; }
      return { label, tone, gaining, weakening, blockersRising, rivals };
    },
  };
})();

</script>

const dcMono = { fontFamily: "var(--font-mono)", fontSize: 10.5, letterSpacing: ".06em", textTransform: "uppercase", color: "#9CA3AF" };
const dcScen = (id) => (window.FM_DATA.scenarios || []).find(s => s.id === id);
const dcEvent = (id) => window.FM_DECISIONS.tracked.find(t => t.evId === id);

function DcSpark({ hist, color }) {
  const w = 84, h = 22, step = w / (hist.length - 1);
  const y = (v) => h - 2 - (v / 4) * (h - 4);
  let d = `M0 ${y(hist[0])}`;
  hist.forEach((v, i) => { if (i) d += ` H${i * step} V${y(v)}`; });
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      {[1, 2, 3].map(l => <line key={l} x1="0" x2={w} y1={y(l)} y2={y(l)} stroke="#F3F4F6"/>)}
      <path d={d} fill="none" stroke={color} strokeWidth="1.6"/>
      <circle cx={w - 1.5} cy={y(hist[hist.length - 1])} r="2.2" fill={color}/>
    </svg>
  );
}

function DcTrend({ t }) {
  const M = window.DecisionModel, d = M.delta(t), last = t.hist[t.hist.length - 1];
  const occurredNow = last === 4 && t.hist[0] < 4;

  return <span className="badge" style={{ background: tone.bg, color: tone.fg, fontSize: 10 }}>{tone.txt}</span>;
}

              <div key={s.id} style={{ border: "1px solid " + (s.id === ds.target ? s.color : "#E5E7EB"), borderRadius: 8, padding: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600 }}><span style={{ width: 7, height: 7, borderRadius: 999, background: s.color }}/>{s.name}</div>
                <div style={{ fontSize: 12, color: "#6B7280", marginTop: 3 }}>{m.label}{s.id === ds.target ? " · target" : ""}</div>
              </div>); })}
          </div>
          {aud === "CSO" && <>
            <H>Frame health</H>
            <div style={{ fontSize: 13, color: "#374151", lineHeight: 1.55 }}>{D.inbox.filter(n => !n.fits).length} of the last {D.inbox.length} discoveries fit no existing force, and both point at sovereign compute capital. Recommend adding the force and testing it in the Matrix. If it proves high-impact and two-sided, re-axis.</div>
            <H>Pending revision to strategy</H>
            {D.revision.items.map((r, i) => <div key={i} style={{ fontSize: 13, lineHeight: 1.55, marginBottom: 4 }}><b>{r.kind}:</b> {r.text}</div>)}
          </>}
          <div style={{ marginTop: 22, paddingTop: 12, borderTop: "1px solid #E5E7EB", fontSize: 11.5, color: "#9CA3AF", lineHeight: 1.5 }}>Momentum shows the relative evidence for each future. It is not a probability, and all four futures stay plausible. Every claim above cites the event or source behind it.</div>
        </div>
      </div>
    </div>
  );
}

// Accept/defer/dismiss an action card; accepted cards update the route move they point at.
window.dcAct = function (a, status) {
  window.DecisionStore.set(s => {
    const moves = Object.assign({}, s.moves);
    if (a.effect && a.effect.move) { if (status === "accepted") moves[a.effect.move] = a.effect.status; else delete moves[a.effect.move]; }
    return { actions: Object.assign({}, s.actions, { [a.id]: status }), moves };
  });
};

Object.assign(window, { DcSpark, DcTrend, DcScenarioDots, DcActionCard, DcBriefing, dcMono, dcScen, dcEvent });

</script>
<script type="text/babel" data-presets="react">
// ─── PAGE (components/page-strategy.jsx)
// Strategy v2: choose a target future → map levers → route of moves → act on Monitoring's recommendations.
function PageStrategy({ navigate }) {
  const D = window.FM_DECISIONS, M = window.DecisionModel;
  const store = window.FM.useStore();
  const scenarios = window.FM_DATA.scenarios;
  const [ds, set] = window.useDecisions();
  const [briefing, setBriefing] = React.useState(false);
  const [showDone, setShowDone] = React.useState(false);
  const target = dcScen(ds.target), health = M.health(ds.target), lev = M.levers(ds.target);
  const route = (D.routes[ds.target] || []).map(m => Object.assign({}, m, { status: ds.moves[m.id] || m.status }));
  const pending = D.actions.filter(a => ds.actions[a.id] === "pending");
  const handled = D.actions.filter(a => ds.actions[a.id] !== "pending");
  const toneCol = { low: "#10B981", mid: "#F59E0B", high: "#EF4444" }[health.tone];
  const card = { padding: 20 };
  const H = (t, sub, right) => (
    <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
      <div><div style={{ fontSize: 14, fontWeight: 600, color: "#1E1B2E" }}>{t}</div>{sub && <div style={{ fontSize: 12.5, color: "#6B7280", marginTop: 2, maxWidth: 640 }}>{sub}</div>}</div>{right}
    </div>);
  const linkLabel = (l) => {
    if (l.kind === "event") { const e = dcEvent(l.ref); return { k: "Event", v: e ? e.title : l.ref }; }
    if (l.kind === "signpost") { const p = D.signposts.find(x => x.id === l.ref); return { k: "Trigger", v: p ? p.name : l.ref }; }
    const o = (store.strategies || window.FM_DATA.strategies).find(x => x.id === l.ref); return { k: "Option", v: o ? o.name : l.ref };
  };
  const stStyle = {
    active: { bg: "#ECFDF5", fg: "#065F46" }, planned: { bg: "#F3F4F6", fg: "#374151" }, held: { bg: "#F9FAFB", fg: "#6B7280" },
    armed: { bg: "#FFFBEB", fg: "#B45309" }, paused: { bg: "#EFF6FF", fg: "#1D4ED8" },
  };
  const lanes = [
    { id: "noregret", name: "No-regret", sub: "Do now. Pays off in all four futures." },
    { id: "shaping", name: "Shaping", sub: "Make the events that lead to the target more likely." },
    { id: "hedge", name: "Hedges", sub: "Held in reserve. Triggered if another future gains ground." },
  ];
  const whens = ["Now", "2027", "2028", "2029–30"];

  const LeverCol = ({ title, sub, items, kind }) => (
    <div style={{ border: "1px solid #E5E7EB", borderRadius: 12, padding: 14, display: "flex", flexDirection: "column", gap: 8 }}>
      <div><div style={{ fontSize: 13, fontWeight: 600 }}>{title} <span style={{ color: "#9CA3AF", fontWeight: 400 }}>{items.length}</span></div><div style={{ fontSize: 12, color: "#6B7280", marginTop: 2 }}>{sub}</div></div>
      {items.map(t => {
        const d = M.delta(t), last = t.hist[t.hist.length - 1];
        const good = kind === "block" ? d < 0 : d > 0;
        return (
          <div key={t.evId} style={{ borderTop: "1px solid #F3F4F6", paddingTop: 8, display: "grid", gridTemplateColumns: "minmax(0,1fr) auto", gap: 8, alignItems: "center" }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 12.5, fontWeight: 500, lineHeight: 1.4 }}>{t.title}</div>
              <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 2 }}>{M.lvl(last)}{kind === "block" ? (t.lever === "influence" ? " · reduce" : " · hedge") : ""}</div>
            </div>
            <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, fontWeight: 600, color: d === 0 ? "#9CA3AF" : good ? "#047857" : "#B91C1C" }}>{d > 0 ? "↑" : d < 0 ? "↓" : "→"}</span>
          </div>);
      })}
    </div>);

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: 20 }} className="scroll-y">
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div className="card" style={card}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
            <div>
              <h2 style={{ margin: 0, fontSize: 18, fontWeight: 600 }}>Strategy</h2>
              <div style={{ fontSize: 13, color: "#6B7280", marginTop: 2 }}>Steer toward the future you want, and be ready for the other three.</div>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={() => setBriefing(true)}><Icons.File size={12}/> Executive briefing</button>
          </div>
          <div style={{ ...dcMono, margin: "18px 0 8px" }}>Target future</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))", gap: 8 }}>
            {scenarios.map(s => { const on = s.id === ds.target, m = M.momentum(s.id); return (
              <button key={s.id} onClick={() => set({ target: s.id })} style={{ textAlign: "left", cursor: "pointer", borderRadius: 10, padding: "10px 12px", background: on ? "#fff" : "#FAFAFA", border: on ? "1.5px solid " + s.color : "1px solid #E5E7EB" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, fontWeight: 600, color: "#1E1B2E" }}><span style={{ width: 8, height: 8, borderRadius: 999, background: s.color }}/>{s.name}</div>
                <div style={{ fontSize: 11.5, color: "#6B7280", marginTop: 3 }}>{s.tagline} · {m.label}</div>
              </button>); })}
          </div>
          <div style={{ fontSize: 12, color: "#9CA3AF", marginTop: 8 }}>The target is your strategic choice, not a score on the scenario. All four futures stay on the board, and every move below is still tested against each one.</div>
          <div style={{ marginTop: 16, display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 12 }}>
            <div style={{ borderLeft: "3px solid " + toneCol, paddingLeft: 12 }}>
              <div style={dcMono}>Route health</div>
              <div style={{ fontSize: 20, fontWeight: 600, marginTop: 2 }}>{health.label}</div>
            </div>
            <div><div style={dcMono}>Gaining</div><div style={{ fontSize: 12.5, color: "#374151", marginTop: 4, lineHeight: 1.45 }}>{health.gaining.map(t => t.title).join(" · ") || "None"}</div></div>
            <div><div style={dcMono}>Pulling you off course</div><div style={{ fontSize: 12.5, color: "#374151", marginTop: 4, lineHeight: 1.45 }}>{[...health.weakening, ...health.blockersRising].map(t => t.title).join(" · ") || "None"}</div></div>
          </div>
        </div>

        <div className="card" style={card}>
          {H("Recommended actions", `${pending.length} waiting · sent from Monitoring when the evidence crossed a threshold`,
            handled.length > 0 && <button className="btn btn-ghost btn-sm" onClick={() => setShowDone(!showDone)}>{showDone ? "Hide" : "Show"} {handled.length} handled</button>)}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(min(100%,300px),1fr))", gap: 10 }}>
            {pending.map(a => <DcActionCard key={a.id} a={a} status="pending" onAct={(x, st) => { window.dcAct(x, st); if (st === "accepted" && x.effect.navigate) navigate(x.effect.navigate); }}/>)}
            {showDone && handled.map(a => <DcActionCard key={a.id} a={a} status={ds.actions[a.id]} onAct={window.dcAct} compact/>)}
          </div>
          {!pending.length && !showDone && <div style={{ fontSize: 13, color: "#6B7280" }}>Nothing waiting. New recommendations arrive after each daily scan.</div>}
        </div>

        <div className="card" style={card}>
          {H(`Levers toward ${target.name}`, "The events that lead to your target, grouped by what you can do about each one.")}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(240px,1fr))", gap: 12 }}>
            <LeverCol title="Influence" sub="Push these with your own moves." items={lev.influence} kind="sup"/>
            <LeverCol title="Watch" sub="Outside your control. Prepare for them." items={lev.watch} kind="sup"/>
            <LeverCol title="Blockers" sub="These pull toward other futures. Reduce or hedge." items={lev.block} kind="block"/>
          </div>
        </div>

        <div className="card" style={card}>
          {H(`Route to ${target.name}`, "Every move is tied to the event it pushes or the signpost that triggers it. Accepted actions update this map.")}
          {route.length ? (
            <div style={{ overflowX: "auto" }}>
              <div style={{ display: "grid", gridTemplateColumns: "170px repeat(4,minmax(170px,1fr))", minWidth: 860, border: "1px solid #E5E7EB", borderRadius: 12, overflow: "hidden" }}>
                <div style={{ background: "#F9FAFB", borderBottom: "1px solid #E5E7EB" }}/>
                {whens.map(w => <div key={w} style={{ ...dcMono, color: "#6B7280", padding: "10px 12px", background: "#F9FAFB", borderBottom: "1px solid #E5E7EB", borderLeft: "1px solid #F3F4F6" }}>{w}</div>)}
                {lanes.map((ln, li) => <React.Fragment key={ln.id}>
                  <div style={{ padding: 12, borderTop: li ? "1px solid #F3F4F6" : "none" }}>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{ln.name}</div>
                    <div style={{ fontSize: 11.5, color: "#6B7280", marginTop: 2, lineHeight: 1.4 }}>{ln.sub}</div>
                  </div>
                  {whens.map(w => (
                    <div key={w} style={{ padding: 8, borderTop: li ? "1px solid #F3F4F6" : "none", borderLeft: "1px solid #F3F4F6", display: "flex", flexDirection: "column", gap: 6 }}>
                      {route.filter(m => m.lane === ln.id && m.when === w).map(m => { const l = linkLabel(m.link), c = stStyle[m.status]; return (
                        <div key={m.id} style={{ border: "1px solid " + (m.status === "armed" ? "#FDE68A" : m.status === "paused" ? "#BFDBFE" : "#E5E7EB"), borderStyle: m.status === "held" ? "dashed" : "solid", borderRadius: 8, padding: "8px 10px", background: "#fff" }}>
                          <div style={{ fontSize: 12.5, fontWeight: 600, lineHeight: 1.35 }}>{m.title}</div>
                          <div style={{ fontSize: 11, color: "#6B7280", marginTop: 4, lineHeight: 1.4 }}><span style={{ color: "#9CA3AF" }}>{m.push ? "Pushes" : l.k}:</span> {l.v}</div>
                          <span className="badge" style={{ marginTop: 6, background: c.bg, color: c.fg, fontSize: 10, textTransform: "capitalize" }}>{m.status}</span>
                        </div>); })}
                    </div>))}
                </React.Fragment>)}
              </div>
            </div>
          ) : (
            <div style={{ border: "1px dashed #E5E7EB", borderRadius: 12, padding: 24, textAlign: "center" }}>
              <div style={{ fontSize: 14, fontWeight: 600 }}>No route to {target.name} yet</div>
              <div style={{ fontSize: 12.5, color: "#6B7280", margin: "4px auto 12px", maxWidth: 420 }}>AI drafts no-regret, shaping and hedge moves from this future's levers and signposts. You review the draft before anything is added.</div>
              <button className="btn btn-primary btn-sm"><Icons.Sparkle size={12}/> Draft route</button>
            </div>)}
        </div>

        {ds.revision === "proposed" && (
          <div className="card" style={{ ...card, border: "1px solid #FED7AA", background: "#FFFBF5" }}>
            {H("Proposed strategy revision", `The evidence has moved since this strategy was set on ${D.revision.since}.`,
              <div style={{ display: "flex", gap: 6 }}>
                <button className="btn btn-primary btn-sm" onClick={() => set({ revision: "applied" })}>Apply revision</button>
                <button className="btn btn-ghost btn-sm" style={{ background: "#fff" }} onClick={() => navigate("/app/matrix")}>Rebuild scenarios</button>
                <button className="btn btn-ghost btn-sm" style={{ border: "none" }} onClick={() => set({ revision: "dismissed" })}>Dismiss</button>
              </div>)}
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {D.revision.items.map((r, i) => <div key={i} style={{ display: "grid", gridTemplateColumns: "96px 1fr", gap: 10, fontSize: 13, lineHeight: 1.5 }}><span style={{ ...dcMono, color: "#C2410C", paddingTop: 2 }}>{r.kind}</span><span>{r.text}</span></div>)}
            </div>
            <div style={{ fontSize: 12, color: "#9A3412", marginTop: 10 }}>Rebuilding scenarios opens the re-axis review in the Matrix. Your current scenarios and route are saved as a snapshot.</div>
          </div>)}

        <div className="card" style={card}>
          {H("Wind tunnel", "How each option performs in all four futures. A route that only works in the target leaves you exposed.")}
          <div style={{ overflowX: "auto" }}>
            <div style={{ minWidth: 720, border: "1px solid #E5E7EB", borderRadius: 12, overflow: "hidden" }}>
              <div style={{ display: "grid", gridTemplateColumns: "minmax(240px,2fr) repeat(4,1fr) 130px", background: "#F9FAFB", borderBottom: "1px solid #E5E7EB", padding: "10px 14px", ...dcMono, color: "#6B7280" }}>
                <div>Option</div>
                {scenarios.map(s => <div key={s.id} style={{ textAlign: "center", color: s.id === ds.target ? s.color : undefined, fontWeight: s.id === ds.target ? 600 : 500 }}>{s.name}</div>)}
                <div style={{ textAlign: "center" }}>Verdict</div>
              </div>
              {(store.strategies || window.FM_DATA.strategies).map((st, i) => {
                const n = st.robustIn.length, inT = st.robustIn.includes(target.name);
                const verdict = n >= 3 ? ["Robust", "badge-low"] : inT ? ["Depends on target", "badge-mid"] : ["Hedge", "badge-mid"];
                return (
                  <div key={st.id} style={{ display: "grid", gridTemplateColumns: "minmax(240px,2fr) repeat(4,1fr) 130px", padding: "12px 14px", alignItems: "center", borderTop: i ? "1px solid #F3F4F6" : "none" }}>
                    <div><div style={{ fontSize: 13.5, fontWeight: 600 }}>{st.name}</div><div style={{ fontSize: 12, color: "#6B7280", marginTop: 2, lineHeight: 1.45 }}>{st.notes}</div></div>
                    {scenarios.map(s => { const ok = st.robustIn.includes(s.name); return (
                      <div key={s.id} style={{ display: "flex", justifyContent: "center", background: s.id === ds.target ? "#FAFAFA" : "transparent", alignSelf: "stretch", alignItems: "center" }}>
                        <span style={{ width: 22, height: 22, borderRadius: 999, background: ok ? "#ECFDF5" : "#FEF2F2", color: ok ? "#10B981" : "#EF4444", display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 600 }}>{ok ? "✓" : "·"}</span>
                      </div>); })}
                    <div style={{ textAlign: "center" }}><span className={"badge " + verdict[1]} style={{ fontSize: 10 }}>{verdict[0]}</span></div>
                  </div>);
              })}
            </div>
          </div>
        </div>
      </div>
      {briefing && <DcBriefing onClose={() => setBriefing(false)}/>}
    </div>
  );
}

window.PageStrategy = PageStrategy;

</script>
