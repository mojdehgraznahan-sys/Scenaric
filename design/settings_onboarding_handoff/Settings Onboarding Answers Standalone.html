<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Project (Onboarding answers) — Standalone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Scenaric.ai design tokens */
:root {
  /* Brand */
  --ink: #1E1B2E;
  --ink-2: #29243D;
  --orange: #F97316;
  --orange-hover: #EA6B0B;
  --orange-50: #FFF7ED;
  --orange-100: #FED7AA;
  --orange-200: #FBC589;
  --orange-700: #C2410C;
  --green-50: #ECFDF5;
  --green-500: #10B981;
  --green-700: #065F46;
  --red-50: #FEF2F2;
  --red-500: #EF4444;
  --amber-300: #F59E0B;
  --amber-50: #FFFBEB;
  --amber-bell: #F59E0B;
  --blue-50: #EFF6FF;
  --blue-500: #3B82F6;
  --blue-700: #1D4ED8;
  --purple-50: #F5F3FF;
  --purple-500: #8B5CF6;
  --teal-50: #F0FDFA;
  --teal-500: #14B8A6;

  /* Surface */
  --bg: #F5F5F5;
  --card: #FFFFFF;
  --border: #E5E7EB;
  --border-strong: #D1D5DB;

  /* Text */
  --text: #0F172A;
  --text-2: #6B7280;
  --text-3: #9CA3AF;

  /* Effects */
  --shadow-card: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.04);
  --shadow-elev: 0 8px 24px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);

  /* Radius */
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 10px;
  --r-xl: 14px;
  --r-2xl: 20px;

  /* Type */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--text);
  background: var(--bg);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* Reusable */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  font-weight: 500;
  border-radius: var(--r-md);
  padding: 10px 16px;
  font-size: 14px;
  line-height: 1;
  border: 1px solid transparent;
  transition: background .15s ease, border-color .15s ease, color .15s ease, transform .05s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(0.5px); }
.btn-primary { background: var(--orange); color: #fff; border-color: var(--orange); }
.btn-primary:hover { background: var(--orange-hover); border-color: var(--orange-hover); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: #F9FAFB; border-color: var(--border-strong); }
.btn-soft { background: var(--orange-50); color: var(--orange-700); border-color: var(--orange-100); }
.btn-soft:hover { background: #FEEBD2; }
.btn-dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-dark:hover { background: #2c2742; }
.btn-on-ink { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.2); }
.btn-on-ink:hover { background: rgba(255,255,255,.15); }
.btn-lg { padding: 14px 22px; font-size: 15px; }
.btn-sm { padding: 7px 11px; font-size: 13px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
}
.input {
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: #fff;
  outline: none;
  transition: border .15s ease, box-shadow .15s ease;
}
.input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(249,115,22,.2); }
.textarea { resize: none; line-height: 1.55; }

a{color:var(--orange-700)}a:hover{color:var(--orange)}
.st-wrap{max-width:1100px;margin:0 auto;padding:20px}.st-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media(max-width:720px){.st-grid{grid-template-columns:1fr}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head><body><div id="root"></div>
<script type="text/babel">
// Standalone reference for Settings → Project → "Onboarding answers".
// Source of truth in the prototype: components/onboarding.jsx (INTERVIEW) + components/page-monitoring-settings.jsx (OnboardingAnswers).
// BACKEND: replace the mock store below with the project's onboarding_answers row (see CLAUDE_CODE_SETTINGS_ONBOARDING_PROMPTS.md).
const INTERVIEW = [
  {
    id: "decision", tag: "A", eyebrow: "THE FOCAL DECISION",
    intro: "Let's start with a real pending decision, not an industry topic.",
    qs: [
      { id: "awake", q: "What keeps you awake at night?", ph: "e.g. committing to the wrong region and not being able to reverse it", big: true },
      { id: "decision", q: "What decision are you facing that will still matter in 5–10 years?", ph: "e.g. whether and how to enter Southeast Asia", big: true },
      { id: "owner", q: "Who actually makes that decision, and by when?", ph: "e.g. the executive team, board sign-off by Q2 2027" },
      { id: "stakes", q: "If you get this wrong, what breaks?", ph: "e.g. two years of capital and our credibility in APAC" },
    ],
  },
  {
    id: "oracle", tag: "B", eyebrow: "THE UNKNOWNS",
    intro: "Imagine you had an oracle that would answer truthfully about the future of your business. What would you ask it? Your questions are the real uncertainties.",
    qs: [
      { id: "o1", q: "Question 1", ph: "e.g. will Indonesia's ownership rules hold through 2032?" },
      { id: "o2", q: "Question 2", ph: "e.g. who will own the distribution layer?", opt: true },
      { id: "o3", q: "Question 3", ph: "e.g. what will capital cost us?", opt: true },
    ],
  },
  {
    id: "hindsight", tag: "C", eyebrow: "GOOD & BAD OUTCOMES",
    intro: "Now stand at the end of your horizon and look back. I want both endings, and the road to each.",
    qs: [
      { id: "good", q: "It has gone as well as it realistically could. Describe it — and what got you there.", big: true },
      { id: "bad", q: "Same year, it has gone badly. Describe it — and the pivotal events.", big: true },
      { id: "turns", q: "Looking back from there, what turning points would you have wanted to see coming?", big: true },
    ],
  },
  {
    id: "forces", tag: "D", eyebrow: "PREDETERMINED VS UNCERTAIN", research: true,
    intro: "Last block — this one separates what's already baked in from what's genuinely open. It also seeds your key forces.",
    qs: [
      { id: "given", q: "What's effectively inevitable over that horizon?", ph: "e.g. demographics, installed base, committed capital, physics", big: true },
      { id: "open", q: "What's genuinely uncertain — and would change your decision if it went either way?", big: true },
      { id: "actors", q: "Which customers, suppliers, competitors or regulators do you depend on but don't control?", big: true },
    ],
  },
];


window.ONBOARDING_INTERVIEW = INTERVIEW;
const SEED_PROJECT = { name: "Helios Grid — SE Asia entry", focal_question: "Over the next 5-10 years, how should our executive team approach entering Southeast Asia, given that Indonesia's ownership rules could go either way?", horizon: "5-10 years", industry: "Energy" };
const SEED_INTERVIEW = {
  awake: "Committing capital to the wrong region and not being able to reverse it for a decade.",
  decision: "Whether and how to enter Southeast Asia with our grid-storage business.",
  owner: "The executive team, board sign-off by Q2 2027",
  stakes: "Two years of capital and our credibility with APAC utility partners.",
  o1: "Will Indonesia's foreign-ownership rules for energy hold through 2032?",
  o2: "Who will own the distribution layer: utilities or independent aggregators?",
  o3: "",
  good: "We are the default storage partner for two national utilities. We got there by entering through a local JV and staying asset-light until the regulations settled.",
  bad: "We built plants in Indonesia, the ownership cap tightened in 2029, and we had to sell at a loss. A rival with Chinese supply undercut us on price.",
  turns: "The 2028 ownership review, and the first utility tender that went to an aggregator instead of a utility.",
  given: "Demand for grid storage keeps rising across the region; our battery supply contracts run until 2030.",
  open: "",
  actors: "State utilities (PLN, EGAT), cell suppliers in China and Korea, and energy ministries.",
};
const StoreCtx = React.createContext(null);
window.FM = { useStore: () => React.useContext(StoreCtx) };
// Read-back of the Schwartz framing interview from onboarding (blocks A–D), editable in place.
function OnboardingAnswers() {
  const store = window.FM.useStore();
  const blocks = window.ONBOARDING_INTERVIEW || [];
  const onb = store.onboarding || {};
  const saved = onb.interview || {};
  const [open, setOpen] = React.useState(blocks[0] ? blocks[0].id : null);
  const [editing, setEditing] = React.useState(null);
  const [draft, setDraft] = React.useState({});
  const answered = blocks.reduce((n, b) => n + b.qs.filter(q => (saved[q.id] || "").trim()).length, 0);
  const total = blocks.reduce((n, b) => n + b.qs.length, 0);
  const startEdit = (b) => { setDraft(Object.fromEntries(b.qs.map(q => [q.id, saved[q.id] || ""]))); setEditing(b.id); setOpen(b.id); };
  const save = () => { store.setOnboarding({ ...onb, interview: { ...saved, ...draft } }); setEditing(null); };
  const mono = { fontFamily: "var(--font-mono)", fontSize: 10.5, letterSpacing: ".06em" };
  return (
    <div style={{ borderTop: "1px solid #F3F4F6", paddingTop: 18, display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: 14, fontWeight: 600, color: "#1E1B2E" }}>Onboarding answers</div>
          <div style={{ fontSize: 12, color: "#6B7280", marginTop: 2, textWrap: "pretty" }}>What you told us when framing the project. The focal question, key forces and scenarios were drawn from these.</div>
        </div>
        <span style={{ ...mono, color: "#9CA3AF" }}>{answered} OF {total} ANSWERED</span>
      </div>
      {blocks.map(b => {
        const isOpen = open === b.id, isEdit = editing === b.id;
        const count = b.qs.filter(q => (saved[q.id] || "").trim()).length;
        return (
          <div key={b.id} style={{ border: "1px solid #E5E7EB", borderRadius: 10, background: "#fff", overflow: "hidden" }}>
            <button onClick={() => setOpen(isOpen ? null : b.id)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "11px 14px", border: "none", background: isOpen ? "#FAFAFA" : "#fff", cursor: "pointer", textAlign: "left", fontFamily: "inherit" }}>
              <span style={{ width: 22, height: 22, borderRadius: 6, background: "#FFF7ED", color: "#C2410C", display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11.5, fontWeight: 700, flexShrink: 0 }}>{b.tag}</span>
              <span style={{ ...mono, color: "#374151", flex: 1 }}>{b.eyebrow}</span>
              <span style={{ fontSize: 11.5, color: count ? "#6B7280" : "#B45309" }}>{count ? count + "/" + b.qs.length : "Not answered"}</span>
              <span style={{ color: "#9CA3AF", fontSize: 11, transform: isOpen ? "rotate(90deg)" : "none", transition: "transform .15s" }}>▶</span>
            </button>
            {isOpen && (
              <div style={{ padding: "4px 14px 14px", display: "flex", flexDirection: "column", gap: 12 }}>
                {b.qs.map(q => {
                  const a = (saved[q.id] || "").trim();
                  return (
                    <div key={q.id} style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                      <div style={{ fontSize: 12, color: "#6B7280", fontWeight: 500 }}>{q.q}{q.opt ? <span style={{ color: "#9CA3AF", fontWeight: 400 }}> (optional)</span> : null}</div>
                      {isEdit
                        ? <textarea className="input textarea" rows={q.big ? 3 : 2} value={draft[q.id] || ""} placeholder={q.ph || ""} onChange={e => setDraft(d => ({ ...d, [q.id]: e.target.value }))} style={{ minHeight: q.big ? 72 : 48 }}></textarea>
                        : <div style={{ fontSize: 13.5, lineHeight: 1.55, color: a ? "#1E1B2E" : "#9CA3AF", fontStyle: a ? "normal" : "italic", whiteSpace: "pre-wrap", textWrap: "pretty" }}>{a || "No answer"}</div>}
                    </div>
                  );
                })}
                <div style={{ display: "flex", gap: 8 }}>
                  {isEdit
                    ? <><button className="btn btn-primary btn-sm" onClick={save}>Save answers</button><button className="btn btn-ghost btn-sm" onClick={() => setEditing(null)}>Cancel</button></>
                    : <button className="btn btn-ghost btn-sm" onClick={() => startEdit(b)}>Edit answers</button>}
                </div>
                {isEdit && <div style={{ fontSize: 11.5, color: "#9CA3AF" }}>Editing these won't rewrite your focal question. Use the assistant below to re-sharpen it.</div>}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}


function SettingsField({ label, value, multiline }) {
  return (<div><div style={{ fontSize: 12, color: "#6B7280", fontWeight: 500, marginBottom: 6 }}>{label}</div>
    {multiline ? <textarea className="input textarea" rows={3} defaultValue={value} style={{ minHeight: 80 }}></textarea> : <input className="input" defaultValue={value}></input>}</div>);
}
function App() {
  const [onboarding, setOnboarding] = React.useState(() => { try { return JSON.parse(localStorage.getItem("standalone.settings.onboarding")) || { interview: SEED_INTERVIEW }; } catch { return { interview: SEED_INTERVIEW }; } });
  const set = (v) => { setOnboarding(v); try { localStorage.setItem("standalone.settings.onboarding", JSON.stringify(v)); } catch {} };
  const [tab, setTab] = React.useState("Project");
  const p = SEED_PROJECT;
  return (
    <StoreCtx.Provider value={{ onboarding, setOnboarding: set, project: p }}>
      <div className="st-wrap" data-screen-label="Settings · Project">
        <div className="st-grid">
          <div className="card" style={{ padding: 8, alignSelf: "start" }}>
            {["Project", "Team", "AI Analyst", "Integrations", "Billing"].map(t => (
              <button key={t} onClick={() => setTab(t)} style={{ width: "100%", textAlign: "left", padding: "9px 12px", borderRadius: 7, border: "none", background: tab === t ? "#FFF7ED" : "transparent", color: tab === t ? "#C2410C" : "#374151", fontSize: 13, fontWeight: 500, marginBottom: 2 }}>{t}</button>
            ))}
          </div>
          <div className="card" style={{ padding: 24, minWidth: 0 }}>
            <h2 style={{ margin: "0 0 14px", fontSize: 18, fontWeight: 600 }}>{tab}</h2>
            {tab === "Project" ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                <SettingsField label="Project name" value={p.name}></SettingsField>
                <SettingsField label="Focal question" value={p.focal_question} multiline></SettingsField>
                <SettingsField label="Time horizon" value={p.horizon}></SettingsField>
                <SettingsField label="Industry" value={p.industry}></SettingsField>
                <OnboardingAnswers></OnboardingAnswers>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, padding: "16px 0 0", borderTop: "1px solid #F3F4F6" }}>
                  <div style={{ fontSize: 12, color: "#6B7280" }}>Standalone only: restore the sample answers.</div>
                  <button className="btn btn-ghost btn-sm" onClick={() => set({ interview: SEED_INTERVIEW })}>Reset sample</button>
                </div>
              </div>
            ) : <div style={{ fontSize: 13, color: "#6B7280" }}>Not part of this handoff. See the main prototype.</div>}
          </div>
        </div>
      </div>
    </StoreCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App></App>);
</script></body></html>
